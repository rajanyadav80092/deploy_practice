{% extends 'home.html' %}
{% block content %}
<div class="main-container">
<div class="divclass">

        <input type="number" name="password" class="glash-input" placeholder="NEW PASSWORD" required><br><br>
        <button class="glash-btn">Submit</button>
    </form>
</div>
</div>
{% endblock %}
