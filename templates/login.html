{% extends 'home.html' %}
{% block content %}
<div class="main-container">
<div class="divclass">
<form action="/api/v1/login" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input class="glash-input" type="text" name="identifier" placeholder="Email/Mobile/Name" required><br><br>
<input class="glash-input" type="password" name="password" placeholder="Enter your password" required><br><br>
<button class="glash-btn" >Log-in</button><br><br>
</form>
<a href="/signin"><button class="glash-btn">Sign-in</button></a><br><br>
<a class="anchor" href="forget"><button class="glash-btn" >Forget-Password</button></a><br><br>
</div>
</div>
{% endblock %}
