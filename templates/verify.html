{% extends 'home.html' %}
{% block content %}
<div class="main-container">
<div class="divclass" >

        <input class="glash-input" type="number" name="otp" placeholder="Fill otp" required><br><br>
        <button class="glash-btn">Submit</button>
    </form>
</div>
</div>
{% endblock %}
